name: Build & Launch Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify Launch (iPhone Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 16 found"
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Resolve package dependencies
        run: |
          xcodebuild -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -resolvePackageDependencies

      - name: Build for iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "^(Build |Compiling|Linking|error:|warning:.*error)" || true
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "Build succeeded"
          else
            echo "::error::Build failed"
            tail -50 build.log
            exit 1
          fi

      - name: Verify app launches in simulator
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" -type d -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi
          echo "Found app: $APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          RUNTIME=$(xcrun simctl list runtimes available -j \
            | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if r['platform'] == 'iOS' and r['isAvailable']]
          if ios:
              print(ios[-1]['identifier'])
          else:
              sys.exit(1)
          ")
          echo "Runtime: $RUNTIME"

          DEVICE_UDID=$(xcrun simctl create "CI iPhone" "iPhone 16" "$RUNTIME")
          echo "Created simulator: $DEVICE_UDID"

          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

          if ! xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID"; then
            echo "::error::App failed to launch"
            xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
            xcrun simctl delete "$DEVICE_UDID" 2>/dev/null || true
            exit 1
          fi

          sleep 5

          if xcrun simctl spawn "$DEVICE_UDID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "App is running successfully after 5 seconds"
          else
            echo "::error::App is not running after 5 seconds — it likely crashed"
            xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
            xcrun simctl delete "$DEVICE_UDID" 2>/dev/null || true
            exit 1
          fi

          xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl delete "$DEVICE_UDID" 2>/dev/null || true
